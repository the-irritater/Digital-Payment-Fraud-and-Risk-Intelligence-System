name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linting dependencies
        run: pip install flake8 black
      - name: Run flake8
        run: flake8 src/ api/ sql/ --max-line-length=150 --ignore=E501,W503
      - name: Check formatting with black
        run: black --check src/ api/ sql/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=term-missing
        env:
          PYTHONPATH: src:sql

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t fraud-intelligence-api:${{ github.sha }} .
      - name: Verify Docker health
        run: |
          docker run -d --name test-api -p 8000:8000 fraud-intelligence-api:${{ github.sha }} || true
          sleep 5
          docker logs test-api || true
          docker stop test-api || true
          docker rm test-api || true
